<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Tecnologia e reflorestamento no campo</title>
  <desc id="desc">Ilustração gerada por IA em estilo infográfico mostrando energia solar, irrigação inteligente e reflorestamento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.42" stop-color="#dceecb"/>
      <stop offset="1" stop-color="#74b7bf"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" x2="1">
