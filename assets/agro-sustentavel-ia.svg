<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Plantação sustentável ao amanhecer</title>
  <desc id="desc">Ilustração gerada por IA em estilo editorial mostrando lavoura, árvores, sensores e sol ao fundo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8d68b"/>
      <stop offset="0.48" stop-color="#b8dba2"/>
      <stop offset="1" stop-color="#6fa66b"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
